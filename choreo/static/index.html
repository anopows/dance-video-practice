<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#131714"><title>Choreo · Videos</title><link rel="icon" href="data:,"><link rel="stylesheet" href="/static/room.css?v=5"><script defer src="/static/room.js?v=5"></script><script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" async defer></script></head>
<body><main class="home"><nav><a class="brand" href="/">choreo<span>practice</span></a><button id="logout" hidden>Lock</button></nav>
<section class="panel" id="unlock"><h1>Upload a video</h1><form id="login-form"><label class="field">Password<input id="password" name="password" type="password" autocomplete="current-password" required maxlength="128"></label><div id="login-check" class="human-check"></div><button class="primary wide" id="login-submit" disabled>Continue</button></form><p class="small muted">Practice links open without a password.</p></section>
<section id="upload-panel" hidden><label class="dropzone" id="dropzone"><strong>＋ Add a video</strong><input id="file" type="file" accept=".mp4,.mov,.m4v,.webm" aria-label="Choose a dance video"></label><p id="retention-note" class="small muted">Up to 500 MB / 10 min · Kept for 90 days.</p><div id="upload-actions" hidden><p id="file-info" aria-live="polite"></p><div id="upload-check" class="human-check"></div><button class="primary wide" id="upload" disabled>Add counts</button></div></section>
<section id="progress-panel" class="panel" hidden><h2 id="progress-title">Uploading…</h2><progress id="progress" max="100" value="0" aria-label="Upload progress"></progress><p id="progress-detail" class="muted" aria-live="polite"></p><button id="resume" hidden>Resume</button><button id="cancel">Cancel</button></section>
<p id="message" role="alert" hidden></p>
<section id="library" hidden><h1>Your videos</h1><div id="projects"></div></section>
</main></body></html>
